services:
  postgres-db:
    image: postgres:16-alpine
    container_name: iloveshopping-db
    environment:
      POSTGRES_DB: iloveshopping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kvit@psql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iloveshopping-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/iloveshopping_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: kvit@psql
      GOOGLE_RECAPTCHA_SECRET: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-replace-this-production-key}
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: iloveshopping-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iloveshopping-web
    ports:
      - "3000:80"
    depends_on:
      - backend-app

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: iloveshopping-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
